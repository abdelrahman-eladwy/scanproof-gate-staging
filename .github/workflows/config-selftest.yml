# Offline self-test of the staging gate configuration. Advisory only: never make this
# a required check; the only required context is "ScanProof verification".
name: config-selftest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    name: staging config self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests/test_staging_config.py
      - run: bash -n admin/bootstrap.sh && bash -n scenarios/open-scenarios.sh
